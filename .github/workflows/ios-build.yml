name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test ADB packet codec
        run: |
          swiftc ADBManager/ADBPacket.swift Tests/ADBPacketSmokeTests.swift -o /tmp/adb-packet-tests
          /tmp/adb-packet-tests
          swiftc ADBManager/ADBSync.swift Tests/ADBSyncSmokeTests.swift -o /tmp/adb-sync-tests
          /tmp/adb-sync-tests
      - name: Build unsigned iOS app
        run: |
          xcodebuild -project ADBManager.xcodeproj -scheme ADBManager -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ADBManager.app Payload/
          zip -r ADBManager-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ADBManager-unsigned-ipa
          path: ADBManager-unsigned.ipa
          if-no-files-found: error
